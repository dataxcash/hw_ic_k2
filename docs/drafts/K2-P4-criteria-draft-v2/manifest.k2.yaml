# criteria/manifest.k2.yaml —— DRAFT v2（ENG 起草；监理正/负控复验 → gate 属主版本 bump 安装 → 监理签认）
manifest_version: 2
project: k2
board: k2_v4_8L.l5.kicad_pcb        # 五步复合板（2026-09-17 落件 6ff49da5678c2108）
not_countersigned: true             # 待监理签认
source_of_truth:
  register: .omo/supervision/ledger/K2-DEFECT-REGISTER-v1.md
  register_section: "## C. 出厂判据"
  rulings: "监理 #K2-19 · #K2-20 · #K2-21（2026-09-17）"
checks:
  zone_filled:              {enabled: true, expect: "filled_netted_nonkeepout_copper_zones == netted_nonkeepout_copper_zones"}
  device_has_pads:          {enabled: true, expect: "every_footprint_pads >= 1"}
  drill_count:              {enabled: true, npth_min: 4, expect: "npth >= 4"}
  net_declared_realized:    {enabled: true, expect: "every_declared_net_pads >= 2"}
  pin_map_complete:         {enabled: true, expect: "missing_pads == 0"}
  non45_segments:           {enabled: true, expect: "non45 == 0"}
  refdes_sets_equal:        {enabled: true, expect: "sch_set == board_set（排除纯机械件 H*，逐条列名留痕）"}
  pipeline_present:         {enabled: true, scope: "k2", expect: "k2 域内每个含 .kicad_sch 的目录被 pipeline.yaml 覆盖"}
  verdict_schema:           {enabled: true, expect: "no artifact contains a 'verdict' key"}
  drc_errors:               {enabled: true, expect: "drc_errors == 0"}
  drc_warning_dispositions: {enabled: true, expect: "board_warning_types ⊆ drc_warning_dispositions[].type"}
  unconnected_zero:         {enabled: true, expect: "unconnected_items == 0"}
  fp_lib_table_present:     {enabled: true, expect: "fp-lib-table exists in board project dir"}
  lib_electrical_level:     {enabled: true, consume: "w8_audit_json", expect: "n_electrical_diff == 0 且 n_pad_name_set_only == 0（以板为准）；审计板 sha16 须 == 受审板 sha16（否则证据陈旧 ⇒ fail-closed）"}
  pads_within_outline:      {enabled: false, pending: "J-8 出框：需 P3-4 定义 + pcbnew 侧检查器"}
  keepout_active:           {enabled: true, expect: "每个 keepout 区 >=1 flag != allowed"}
  density_and_clearance:    {enabled: false, pending: "J-8 密度/关键间距：需 P3 图纸阈值定义"}
  ref_plane_continuity:     {enabled: false, pending: "V3：需 pcbnew 侧相邻层参考平面覆盖检查器"}
rule_severity_exemptions: []
drc_warning_dispositions:
  - {type: missing_courtyard, disposition: "不豁免；courtyard 补齐登记为 J-7 图形级已知缺口 + L2 placement 项", evidence: "k2/docs/K2-P4-W7-SUPERVISION-DECISION-SHEET-v1.md 裁定项4 + 监理 #K2-21 §〇③ 40 件清单"}
  - {type: lib_footprint_mismatch, disposition: "以板为准（W-8）：电气级 0，图形/属性级容忍，逐条登记", evidence: "k2/docs/K2-J7-W8-FOOTPRINT-LIB-AUDIT-v1.md（59 件逐条）"}
thresholds: {}
thresholds_pending_supervisor: []
