  - id: T2-F4
    severity: 中
    finding: 12 件厂商直链**自动化不可达**（ST 567 反自动化 · onsemi/Diodes 403/404 · Molex HTTP/2 中断 · usb.org 版本化文件名漂移 · SpacemiT 无公开直链）。已列每件失败码与候选路径；出路 = 人工浏览器取件或分销商镜像（Mouser/LCSC）——**须人工/半自动**。
