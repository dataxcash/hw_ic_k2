  - id: T2-F5
    severity: 中
    finding: '**厂商站点级反自动化**：onsemi 全站 403（含 legacy `/pub/Collateral/`）、st.com 端点 567（`.com.cn` 镜像同 567）⇒ 这两家的 12 件中 4 件**无法在自动化环境取证**，须人工浏览器/代理；另 usb.org **无 USB 3.2 基规公开直链**（仅合规/嵌入件）⇒ `USB3.0_Type-A_90` 仍缺。'
  - id: T2-F1
    severity: 中
    finding: '**两处引用号与厂商当前件不符**：sch_gate `TPD6E05U06` 引 ''SLLSE95'' ⇒ 实测 **SLVSBO7O**；`TS3USB221A` 引 ''SCDS239A'' ⇒ 实测 **SCDS277C**。两件产品名在 PDF 全文命中（TPD6E05U06 ×89 · TS3USB221A ×55）⇒ 同一器件的**文献号漂移/笔误**。'
  - id: T2-F2
