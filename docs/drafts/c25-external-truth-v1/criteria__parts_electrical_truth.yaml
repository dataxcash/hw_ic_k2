    finding: 5 件为**付费/注册标准**（JEDEC JESD84-B51 · PCI-SIG M.2/OCuLink · SNIA SFF-TA-1016/SFF-8654）⇒ **无合法免费全文**，不可能有 `doc_sha256`；出路 = 以『标准号 + 官方条目页』为出处，或提供内部获授权副本的 sha（须 owner/法务面）。
  - id: T2-F3
    severity: 低
