TPS22990:
  part: TPS22990
  package: "DML (WSON), 10 pins + thermal pad"
  doc_id: "TI SLVSDK1C"
  doc_url: "https://www.ti.com/lit/ds/symlink/tps22990.pdf"
  doc_sha256: "ea198776524544eb3e4a130f1f6a6e5c8e80ca8164eebf387a8fd6b4b7dde2a3"   # 下载件实测一致
  doc_sha256_verified: true
  where: "§6 Pin Configuration and Functions（DML 10-Pin WSON Top/Bottom View + Pin Functions 表）"
  excerpt: "VBIAS 4 … Bias voltage. Power supply to the device | VOUT 8/9/10 … Switch output | — VIN (Thermal Pad) … Switch input"
  pins:
    1: {name: CT,    type: O,   note: "VOUT slew rate control"}
    2: {name: NC,    type: "-", note: "Not internally connected"}
    3: {name: VIN,   type: I,   note: "Switch input. Bypass with ceramic cap to GND"}
    4: {name: VBIAS, type: P,   note: "Bias voltage. Power supply to the device (2.5–5.5V; VIN 0.6V–VBIAS)  **必需**"}
    5: {name: ON,    type: I,   note: "Active high switch control. Do not leave floating"}
    6: {name: GND,   type: "GND", note: "Device ground"}
    7: {name: PG,    type: O,   note: "Power good, active-high open drain. Tie to GND if not used"}
    8: {name: VOUT,  type: O,   note: "Switch output"}
    9: {name: VOUT,  type: O,   note: "Switch output"}
    10: {name: VOUT, type: O,   note: "Switch output"}
    "EP": {name: "VIN (Thermal Pad)", type: I, note: "Tie to VIN"}
  n_pins: 10
  has_thermal_pad: true

